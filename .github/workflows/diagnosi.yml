name: Diagnosi sito

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnosi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Header e updatedAt
        run: |
          for u in data/certs.json data/list.json api/v1/meta.json; do
            echo "=== $u"; curl -s -D - -o /dev/null -m 30 "https://radar-certificati.cottinob.workers.dev/$u?t=$(date +%s)" | grep -iE '^(HTTP|content-type|content-length|access-control-allow-origin)' || true
          done
          curl -s -m 30 "https://radar-certificati.cottinob.workers.dev/data/list.json?t=$(date +%s)" | python3 -c "import json,sys;d=json.load(sys.stdin);print('list.json updatedAt',d['updatedAt'],'righe',len(d['rows']))" || echo "list.json non leggibile"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Prova con browser
        run: |
          pip install -q playwright==1.47.0
          python -m playwright install --with-deps chromium > /dev/null
          python scraper/smoke_site.py
      - name: Pubblica schermate sul branch smoke
        if: always()
        run: |
          mkdir -p smoke && cp -r smoke /tmp/sm && cd /tmp/sm
          git init -q -b smoke && git config user.name "radar-bot" && git config user.email "radar-bot@users.noreply.github.com"
          git add -A && git commit -q -m "Prova sito ${{ github.run_id }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" smoke
