name: Diagnosi sito

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnosi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dominio (DNS, HTTPS, redirect)
        run: |
          for h in radarcertificati.com www.radarcertificati.com radar-certificati.cottinob.workers.dev; do
            echo "=== $h"
            echo "DNS: $(dig +short A $h | tr '\n' ' ') $(dig +short AAAA $h | tr '\n' ' ')"
            for s in http https; do
              curl -s -o /dev/null -m 20 -w "$s -> %{http_code} redirect=%{redirect_url} ip=%{remote_ip}\n" "$s://$h/" || echo "$s -> errore"
            done
            echo | openssl s_client -connect $h:443 -servername $h 2>/dev/null | openssl x509 -noout -subject -issuer -enddate 2>/dev/null || echo "certificato: non disponibile"
            curl -s -m 20 "https://$h/" | grep -o '<title>[^<]*</title>' || true
          done
          echo "=== versione pubblicata (sw.js)"; curl -s -m 20 "https://radar-certificati.cottinob.workers.dev/sw.js" | grep -o 'radar-v[0-9]*' | head -1 || true
          echo "=== registrazione"; whois radarcertificati.com 2>/dev/null | grep -iE "creation date|registrar:|name server" | head -6 || true
      - name: Header e updatedAt
        env:
          SITE: ${{ vars.SITE_URL || 'https://radar-certificati.cottinob.workers.dev' }}
        run: |
          for u in data/certs.json data/list.json api/v1/meta.json; do
            echo "=== $u"; curl -s -D - -o /dev/null -m 30 "${SITE%/}/$u?t=$(date +%s)" | grep -iE '^(HTTP|content-type|content-length|access-control-allow-origin)' || true
          done
          curl -s -m 30 "${SITE%/}/data/list.json?t=$(date +%s)" | python3 -c "import json,sys;d=json.load(sys.stdin);print('list.json updatedAt',d['updatedAt'],'righe',len(d['rows']))" || echo "list.json non leggibile"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Prova con browser
        run: |
          pip install -q playwright==1.47.0
          python -m playwright install --with-deps chromium > /dev/null
          python scraper/smoke_site.py "${{ vars.SITE_URL || 'https://radar-certificati.cottinob.workers.dev/' }}"
      - name: Pubblica schermate sul branch smoke
        if: always()
        run: |
          mkdir -p smoke && cp -r smoke /tmp/sm && cd /tmp/sm
          git init -q -b smoke && git config user.name "radar-bot" && git config user.email "radar-bot@users.noreply.github.com"
          git add -A && git commit -q -m "Prova sito ${{ github.run_id }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" smoke
