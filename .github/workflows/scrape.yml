name: Aggiornamento certificati

on:
  schedule:
    # in orario di borsa (SeDeX/Cert-X 9:00-17:30): fuori orario gli emittenti non espongono denaro/lettera
    - cron: "40 9 * * 1-5"    # 11:40 ora italiana (legale), 10:40 in inverno
    - cron: "40 14 * * 1-5"   # 16:40 ora italiana (legale), 15:40 in inverno
  workflow_dispatch:
    inputs:
      sources:
        description: "Sorgenti (vuoto = tutte)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installa Playwright
        run: |
          pip install playwright==1.47.0
          python -m playwright install --with-deps chromium
      - name: Esegui robot
        run: python scraper/run.py ${{ github.event.inputs.sources }}
      - name: Salva esplorazione
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: discovery
          path: discovery/
          retention-days: 7
      - name: Pubblica esplorazione sul branch discovery
        if: always()
        run: |
          rm -rf /tmp/disc && cp -r discovery /tmp/disc && cd /tmp/disc
          git init -q -b discovery
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add -A && git commit -q -m "Esplorazione run ${{ github.run_id }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" discovery
      - name: Pubblica dati
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add docs/data/certs.json
          git diff --cached --quiet || git commit -m "Dati certificati $(date -u +%F)"
          git push
