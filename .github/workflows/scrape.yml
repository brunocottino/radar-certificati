name: Aggiornamento certificati

on:
  schedule:
    # 09:35 e 16:15 ora di Roma (Europe/Rome), lun-ven. GitHub usa l'UTC: ogni cron ha due occorrenze,
    # una per l'ora legale (+0200: 07:35 e 14:15 UTC) e una per l'ora solare (+0100: 08:35 e 15:15 UTC).
    # Il primo step tiene solo quella giusta per il fuso del giorno; il calendario di borsa salta le festività.
    - cron: "35 7,8 * * 1-5"
    - cron: "15 14,15 * * 1-5"
    # Recuperi: GitHub ritarda di ore o salta le run programmate (16/10 partite con 5 ore di ritardo, 19/10 nessuna).
    # Se la fascia non è ancora pubblicata la recuperano; altrimenti si fermano al primo step (pochi secondi).
    - cron: "5 9,10,11 * * 1-5"
    - cron: "50 14,15,16 * * 1-5"
  workflow_dispatch:
    inputs:
      sources:
        description: "Sorgenti (vuoto = tutte)"
        required: false
        default: ""
      auto:
        description: "Avvio dall'orologio Cloudflare: salta se la fascia è già pubblicata o la borsa è chiusa"
        type: boolean
        required: false
        default: false
      debug:
        description: "Pubblica l'esplorazione sul branch discovery"
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          # sempre l'ultima versione del branch, non quella del momento in cui GitHub ha messo la run in coda:
          # una run rimasta in coda dietro un'altra deve vedere la fascia appena pubblicata (il 20/10 una seconda
          # run delle 16:15 è ripartita da capo ed è fallita in conflitto) e usare il codice più recente
          ref: ${{ github.ref_name }}
          fetch-depth: 50
      - name: Orario di Roma (09:35 / 16:15)
        id: ora
        # Run manuali: sempre, senza controlli d'orario.
        # Run programmate: github.event.schedule dice quale cron è partito (mattina o pomeriggio); TZ=Europe/Rome
        # dà il fuso del giorno e quindi l'orario UTC giusto (+0200: 07:35/14:15, +0100: 08:35/15:15).
        # GitHub non anticipa mai ma ritarda anche di molti minuti: la run parte se l'orario giusto è già passato
        # e la fascia di oggi non è ancora stata pubblicata (commit "Dati certificati <data> <fascia>").
        # Così l'occorrenza dell'altro fuso, se arriva prima, salta; se l'occorrenza giusta arriva in ritardo
        # non si perde; e la seconda occorrenza dello stesso giorno trova la fascia già coperta e non la ripete.
        env:
          EVENT: ${{ github.event_name }}
          CRON: ${{ github.event.schedule }}
          AUTO: ${{ inputs.auto }}
        run: |
          if [ "$EVENT" != "schedule" ]; then
            # parte sempre; se è dopo le 09:35 o le 16:15 di Roma e quella fascia non è ancora pubblicata, la occupa
            # (così i cron di recupero non rifanno lo stesso lavoro)
            HM=$(TZ=Europe/Rome date +%H%M); SLOT=manuale
            if [ $((10#$HM)) -ge 1615 ]; then SLOT="16:15"; elif [ $((10#$HM)) -ge 935 ]; then SLOT="09:35"; fi
            if [ "$SLOT" != manuale ] && git log --since="30 hours ago" --format=%s | grep -qxF "Dati certificati $(TZ=Europe/Rome date +%F) $SLOT"; then
              # avvio dall'orologio Cloudflare con la fascia già fatta (es. da GitHub o da un doppione): niente da fare
              if [ "$AUTO" = "true" ]; then echo "Salta: fascia delle $SLOT di oggi già pubblicata"; echo "go=false" >> "$GITHUB_OUTPUT"; exit 0; fi
              SLOT=manuale
            fi
            echo "Run manuale: nessun controllo d'orario (fascia: $SLOT)"
            echo "go=true" >> "$GITHUB_OUTPUT"; echo "slot=$SLOT" >> "$GITHUB_OUTPUT"; exit 0
          fi
          OFF=$(TZ=Europe/Rome date +%z)   # +0200 ora legale, +0100 ora solare
          case "$CRON" in
            "35 7,8 * * 1-5")   SLOT="09:35"; LEGALE=0735; SOLARE=0835 ;;
            "15 14,15 * * 1-5") SLOT="16:15"; LEGALE=1415; SOLARE=1515 ;;
            "5 9,10,11 * * 1-5")  SLOT="09:35"; LEGALE=0735; SOLARE=0835; echo "Recupero della fascia 09:35" ;;
            "50 14,15,16 * * 1-5") SLOT="16:15"; LEGALE=1415; SOLARE=1515; echo "Recupero della fascia 16:15" ;;
            *) echo "Cron non previsto: '$CRON'"; echo "go=false" >> "$GITHUB_OUTPUT"; exit 0 ;;
          esac
          case "$OFF" in
            +0200) WANT=$LEGALE ;;
            +0100) WANT=$SOLARE ;;
            *) echo "Fuso di Roma inatteso: $OFF"; echo "go=false" >> "$GITHUB_OUTPUT"; exit 0 ;;
          esac
          NOW=$(date -u +%H%M)
          echo "cron '$CRON' · Roma $(TZ=Europe/Rome date '+%F %H:%M %z') · UTC $NOW · orario giusto oggi ${WANT} UTC (${SLOT} Roma)"
          if [ $((10#$NOW)) -lt $((10#$WANT)) ]; then
            echo "Salta: occorrenza dell'altro fuso (le ${SLOT} di Roma oggi sono le ${WANT:0:2}:${WANT:2} UTC)"
            echo "go=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          TAG="Dati certificati $(TZ=Europe/Rome date +%F) ${SLOT}"
          if git log --since="30 hours ago" --format=%s | grep -qxF "$TAG"; then
            echo "Salta: fascia delle ${SLOT} di oggi già pubblicata"
            echo "go=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "Parte: fascia delle ${SLOT}"
          echo "go=true" >> "$GITHUB_OUTPUT"; echo "slot=${SLOT}" >> "$GITHUB_OUTPUT"
      - name: Calendario di borsa
        id: cal
        # le run programmate partono solo nei giorni di apertura di Borsa Italiana; quelle manuali sempre
        run: |
          if [ "${{ steps.ora.outputs.go }}" != "true" ]; then echo "open=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ "${{ github.event_name }}" != "schedule" ] && [ "${{ inputs.auto }}" != "true" ]; then echo "open=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          python3 scraper/borsa.py
      - uses: actions/setup-python@v5
        if: steps.cal.outputs.open == 'true'
        with:
          python-version: "3.12"
      - name: Installa Playwright
        if: steps.cal.outputs.open == 'true'
        run: |
          pip install playwright==1.47.0 numpy==2.1.3
          python -m playwright install --with-deps chromium
          sudo apt-get install -y -q poppler-utils > /dev/null  # pdftotext per i term sheet Marex
      - name: Esegui robot
        if: steps.cal.outputs.open == 'true'
        run: python scraper/run.py ${{ github.event.inputs.sources }}
      - name: Cache prezzi sottostanti
        if: steps.cal.outputs.open == 'true'
        uses: actions/cache@v4
        with:
          path: data/prices
          key: prices-${{ github.run_id }}
          restore-keys: prices-
      - name: Volatilità e probabilità di tenuta barriera
        if: steps.cal.outputs.open == 'true'
        continue-on-error: true
        run: python scraper/risk.py
      - name: API pubblica
        if: steps.cal.outputs.open == 'true'
        run: python scraper/api.py
      - name: Salva esplorazione
        if: always() && steps.cal.outputs.open == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: discovery
          path: discovery/
          retention-days: 7
      - name: Pubblica esplorazione sul branch discovery
        if: always() && steps.cal.outputs.open == 'true' && github.event_name == 'workflow_dispatch' && github.event.inputs.debug == 'true'
        run: |
          rm -rf /tmp/disc && cp -r discovery /tmp/disc && cd /tmp/disc
          git init -q -b discovery
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add -A && git commit -q -m "Esplorazione run ${{ github.run_id }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" discovery
      - name: Pubblica dati
        if: steps.cal.outputs.open == 'true'
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add docs/data docs/api history scraper/underlyings_map.json $(ls scraper/risk_state.json scraper/leonteq_state.json scraper/scheda_state.json scraper/bnp_detail_state.json scraper/intesa_detail_state.json scraper/vontobel_detail_state.json scraper/marex_detail_state.json scraper/leonteq_detail_state.json scraper/unicredit_detail_state.json 2>/dev/null)
          # le run programmate firmano il commit con la fascia (09:35 / 16:15): serve al controllo d'orario
          SLOT="${{ steps.ora.outputs.slot }}"
          MSG="Dati certificati $(TZ=Europe/Rome date +%F)"
          [ "$SLOT" != "manuale" ] && MSG="$MSG $SLOT"
          git diff --cached --quiet || git commit -m "$MSG"
          # file generati toccati anche da un commit arrivato nel frattempo: tiene quelli appena prodotti
          git pull --rebase -X theirs -q origin "${GITHUB_REF_NAME}"
          git push
      - name: Verifica che il sito mostri i nuovi dati
        if: steps.cal.outputs.open == 'true'
        # fallisce la run se entro 30 minuti dal push il sito non serve l'updatedAt appena pubblicato (o uno più recente).
        # Il 26/10 Cloudflare ha impiegato tra 10 e 40 minuti a pubblicare: con 10 minuti la run falliva a dati già online
        run: |
          SITE=https://radar-certificati.cottinob.workers.dev  # dove il robot pubblica i dati
          SITE="${SITE%/}"
          WANT=$(python3 -c "import json;print(json.load(open('docs/data/certs.json'))['updatedAt'])")
          echo "updatedAt atteso: $WANT"
          for i in $(seq 1 60); do
            GOT=$(curl -s -m 30 "$SITE/data/certs.json?t=$(date +%s)" | python3 -c "import json,sys;print(json.load(sys.stdin).get('updatedAt'))" 2>/dev/null || echo "errore")
            echo "tentativo $i: sito=$GOT"
            # stesso updatedAt o più recente (una run successiva ha già pubblicato): le date ISO si confrontano come testo
            if [ "$GOT" = "$WANT" ] || { [ "$GOT" != "errore" ] && [ "$GOT" != "None" ] && [[ "$GOT" > "$WANT" ]]; }; then OK=1; break; fi
            sleep 30
          done
          H=$(curl -sI "$SITE/api/v1/meta.json" || true)
          {
            echo "### Verifica sito"
            echo "- updatedAt atteso: \`$WANT\`"
            echo "- updatedAt sul sito: \`$GOT\`"
            echo '```'; echo "$H" | grep -iE '^(HTTP|access-control-allow-origin|content-type)'; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -z "${OK:-}" ]; then
            echo "::error title=Sito non aggiornato::dopo 30 minuti $SITE mostra updatedAt=$GOT invece di $WANT (deploy non avvenuto?)"
            exit 1
          fi
