name: Aggiornamento certificati

on:
  schedule:
    # ogni ora nei giorni feriali: GitHub ritarda o salta i cron, quindi è scraper/slot.py a decidere
    # se partire (borsa aperta e fascia mattina 9:30-13:00 o pomeriggio 14:30-17:20 ancora da coprire)
    - cron: "7 7-15 * * 1-5"
  workflow_dispatch:
    inputs:
      sources:
        description: "Sorgenti (vuoto = tutte)"
        required: false
        default: ""
      debug:
        description: "Pubblica l'esplorazione sul branch discovery"
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50
      - name: Calendario di borsa e fascia oraria
        id: cal
        # le run programmate partono solo a borsa aperta e una volta per fascia; quelle manuali girano sempre
        run: |
          LAST=$(git log -1 --format=%ct --grep='^Dati certificati' || echo 0)
          python3 scraper/slot.py "${{ github.event_name }}" "${LAST:-0}"
      - uses: actions/setup-python@v5
        if: steps.cal.outputs.open == 'true'
        with:
          python-version: "3.12"
      - name: Installa Playwright
        if: steps.cal.outputs.open == 'true'
        run: |
          pip install playwright==1.47.0 numpy==2.1.3
          python -m playwright install --with-deps chromium
      - name: Esegui robot
        if: steps.cal.outputs.open == 'true'
        run: python scraper/run.py ${{ github.event.inputs.sources }}
      - name: Cache prezzi sottostanti
        if: steps.cal.outputs.open == 'true'
        uses: actions/cache@v4
        with:
          path: data/prices
          key: prices-${{ github.run_id }}
          restore-keys: prices-
      - name: Volatilità e probabilità di tenuta barriera
        if: steps.cal.outputs.open == 'true'
        continue-on-error: true
        run: python scraper/risk.py
      - name: API pubblica
        if: steps.cal.outputs.open == 'true'
        run: python scraper/api.py
      - name: Salva esplorazione
        if: always() && steps.cal.outputs.open == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: discovery
          path: discovery/
          retention-days: 7
      - name: Pubblica esplorazione sul branch discovery
        if: always() && steps.cal.outputs.open == 'true' && github.event_name == 'workflow_dispatch' && github.event.inputs.debug == 'true'
        run: |
          rm -rf /tmp/disc && cp -r discovery /tmp/disc && cd /tmp/disc
          git init -q -b discovery
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add -A && git commit -q -m "Esplorazione run ${{ github.run_id }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" discovery
      - name: Pubblica dati
        if: steps.cal.outputs.open == 'true'
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add docs/data docs/api scraper/underlyings_map.json $(ls scraper/risk_state.json scraper/leonteq_state.json scraper/scheda_state.json scraper/bnp_detail_state.json scraper/intesa_detail_state.json 2>/dev/null)
          git diff --cached --quiet || git commit -m "Dati certificati $(date -u +%F)"
          git pull --rebase -q origin "${GITHUB_REF_NAME}"
          git push
      - name: Verifica che il sito mostri i nuovi dati
        if: steps.cal.outputs.open == 'true'
        # fallisce la run se entro 5 minuti dal push il sito non serve l'updatedAt appena pubblicato
        run: |
          SITE=https://radar-certificati.cottinob.workers.dev  # dove il robot pubblica i dati
          SITE="${SITE%/}"
          WANT=$(python3 -c "import json;print(json.load(open('docs/data/certs.json'))['updatedAt'])")
          echo "updatedAt atteso: $WANT"
          for i in $(seq 1 15); do
            GOT=$(curl -s -m 30 "$SITE/data/certs.json?t=$(date +%s)" | python3 -c "import json,sys;print(json.load(sys.stdin).get('updatedAt'))" 2>/dev/null || echo "errore")
            echo "tentativo $i: sito=$GOT"
            if [ "$GOT" = "$WANT" ]; then break; fi
            sleep 20
          done
          H=$(curl -sI "$SITE/api/v1/meta.json" || true)
          {
            echo "### Verifica sito"
            echo "- updatedAt atteso: \`$WANT\`"
            echo "- updatedAt sul sito: \`$GOT\`"
            echo '```'; echo "$H" | grep -iE '^(HTTP|access-control-allow-origin|content-type)'; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$GOT" != "$WANT" ]; then
            echo "::error title=Sito non aggiornato::dopo 5 minuti $SITE mostra updatedAt=$GOT invece di $WANT (deploy non avvenuto?)"
            exit 1
          fi
