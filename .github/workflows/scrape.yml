name: Aggiornamento certificati

on:
  schedule:
    # a borsa aperta (SeDeX/Cert-X 9:00-17:30): 11:20 e 16:20 con l'ora legale, 10:20 e 15:20 con l'ora solare
    - cron: "20 9,14 * * 1-5"
  workflow_dispatch:
    inputs:
      sources:
        description: "Sorgenti (vuoto = tutte)"
        required: false
        default: ""
      debug:
        description: "Pubblica l'esplorazione sul branch discovery"
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Calendario di borsa
        id: cal
        # le run programmate saltano i giorni di chiusura di Borsa Italiana; quelle manuali girano sempre
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            python3 scraper/borsa.py
          else
            python3 scraper/borsa.py || true
            echo "open=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v5
        if: steps.cal.outputs.open == 'true'
        with:
          python-version: "3.12"
      - name: Installa Playwright
        if: steps.cal.outputs.open == 'true'
        run: |
          pip install playwright==1.47.0
          python -m playwright install --with-deps chromium
      - name: Esegui robot
        if: steps.cal.outputs.open == 'true'
        run: python scraper/run.py ${{ github.event.inputs.sources }}
      - name: Salva esplorazione
        if: always() && steps.cal.outputs.open == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: discovery
          path: discovery/
          retention-days: 7
      - name: Pubblica esplorazione sul branch discovery
        if: always() && steps.cal.outputs.open == 'true' && github.event_name == 'workflow_dispatch' && github.event.inputs.debug == 'true'
        run: |
          rm -rf /tmp/disc && cp -r discovery /tmp/disc && cd /tmp/disc
          git init -q -b discovery
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add -A && git commit -q -m "Esplorazione run ${{ github.run_id }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" discovery
      - name: Pubblica dati
        if: steps.cal.outputs.open == 'true'
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add docs/data/certs.json
          git diff --cached --quiet || git commit -m "Dati certificati $(date -u +%F)"
          git pull --rebase -q origin "${GITHUB_REF_NAME}"
          git push
